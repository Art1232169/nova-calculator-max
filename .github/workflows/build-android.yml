
name: Find Android project

on:
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project files
        run: |
          echo "Repository root:"
          pwd
          echo "Files and folders:"
          ls -la
          echo "Android project files:"
          find . -type f \( \
            -name "buildozer.spec" -o \
            -name "main.py" \
          \) -print
