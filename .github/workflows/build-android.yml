
name: Build Nova Calculator MAX for Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev libltdl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"


      - name: Build APK
        working-directory: android.
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCalculatorMAX-Android
          path: android./bin/*.apk
          if-no-files-found: error
