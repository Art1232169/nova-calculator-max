
      - name: Locate calculator source
        run: |
          echo "Files in repository:"
          find . -maxdepth 6 -type f -name "*.py" -print
          SOURCE="$(find . -type f -name 'nova_calculator_max.py' -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "ERROR: nova_calculator_max.py was not found."
            exit 1
          fi
          echo "Found source: $SOURCE"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "NovaCalculatorMAX" \
            "$SOURCE"
